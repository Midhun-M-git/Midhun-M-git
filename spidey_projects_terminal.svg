<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="auto">
<defs>
  <style>
    .term-text {
      font-family: 'Fira Code', Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
      font-size: 13.5px;
      fill: #c9d1d9;
    }
    .prompt {
      fill: #e74c3c;
      font-weight: 700;
    }
    .path {
      fill: #38bdf8;
    }
    .cmd {
      fill: #f0f6fc;
      font-weight: 600;
    }
    .proj-title {
      fill: #58a6ff;
      font-weight: 700;
      font-size: 14.5px;
    }
    .proj-desc {
      fill: #8b949e;
    }
    .tech-tag {
      fill: #2ea043;
      font-weight: 600;
    }
    .status-tag {
      fill: #38bdf8;
    }
    .cursor {
      animation: blink 0.8s infinite;
      fill: #e74c3c;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</defs>

<!-- TERMINAL WINDOW CONTAINER -->
<rect width="800" height="320" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

<!-- TERMINAL HEADER BAR -->
<path d="M0 10 Q0 0 10 0 L790 0 Q800 0 800 10 L800 32 L0 32 Z" fill="#21262d"/>
<line x1="0" y1="32" x2="800" y2="32" stroke="#30363d" stroke-width="1"/>

<!-- TERMINAL DOTS -->
<circle cx="20" cy="16" r="6" fill="#ff5f56"/>
<circle cx="38" cy="16" r="6" fill="#ffbd2e"/>
<circle cx="56" cy="16" r="6" fill="#27c93f"/>

<!-- TERMINAL TITLE -->
<text x="400" y="21" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', 'Courier New', monospace" font-size="12" text-anchor="middle" font-weight="600">🕷️ spidey@novustech: ~/projects (zsh)</text>

<!-- SPIDER WEB ACCENT IN TOP RIGHT OF TERMINAL -->
<g transform="translate(800, 0) scale(-1, 1)">
  <path d="M 0 0 L 50 0 M 0 0 L 40 18 M 0 0 L 20 32" stroke="#0099ff" stroke-width="1.5" fill="none" opacity="0.6"/>
</g>

<!-- TERMINAL COMMAND PROMPT -->
<text x="20" y="58" class="term-text"><tspan class="prompt">spidey@novustech</tspan>:<tspan class="path">~/projects</tspan>$ <tspan class="cmd">./fetch_overview.sh --format=table</tspan></text>

<!-- PROJECT 1: WebApp Security Analyzer -->
<g transform="translate(20, 85)">
  <a href="https://github.com/Midhun-M-git/webapp-security-analyzer" target="_blank">
    <text x="0" y="0" class="proj-title">📂 1. WebApp Security Analyzer</text>
  </a>
  <text x="24" y="18" class="term-text proj-desc">├─ Description: Custom GUI tool for vulnerability scanning &amp; threat detection</text>
  <text x="24" y="36" class="term-text">└─ Tech: <tspan class="tech-tag">Python</tspan> • <tspan class="tech-tag">Tkinter</tspan>  |  Status: <tspan class="status-tag">🌐 Public</tspan></text>
</g>

<!-- PROJECT 2: Asthra -->
<g transform="translate(20, 150)">
  <a href="https://github.com/Midhun-M-git/asthra" target="_blank">
    <text x="0" y="0" class="proj-title">📂 2. Asthra</text>
  </a>
  <text x="24" y="18" class="term-text proj-desc">├─ Description: AI-driven mobile app automating technical documentation</text>
  <text x="24" y="36" class="term-text">└─ Tech: <tspan class="tech-tag">Flutter</tspan> • <tspan class="tech-tag">AI Backend</tspan>  |  Status: <tspan class="status-tag">🌐 Public</tspan></text>
</g>

<!-- PROJECT 3: Breach Checker Engine -->
<g transform="translate(20, 215)">
  <a href="https://github.com/Midhun-M-git/breach-checker-app" target="_blank">
    <text x="0" y="0" class="proj-title">📂 3. Breach Checker Engine</text>
  </a>
  <text x="24" y="18" class="term-text proj-desc">├─ Description: Secure credential validation engine querying global breach data</text>
  <text x="24" y="36" class="term-text">└─ Tech: <tspan class="tech-tag">Python</tspan> • <tspan class="tech-tag">REST APIs</tspan>  |  Status: <tspan class="status-tag">🌐 Public</tspan></text>
</g>

<!-- BOTTOM PROMPT & BLINKING CURSOR -->
<text x="20" y="295" class="term-text"><tspan class="prompt">spidey@novustech</tspan>:<tspan class="path">~/projects</tspan>$ <tspan class="cursor">█</tspan></text>

</svg>
        .clip-line-3 { animation: l_kf_3 30s infinite steps(25); -webkit-animation: l_kf_3 30s infinite steps(25); }
        @keyframes l_kf_3 { 0%, 75% { width: 0px; } 91%, 100% { width: 770px; } }
        @-webkit-keyframes l_kf_3 { 0%, 75% { width: 0px; } 91%, 100% { width: 770px; } }

    .clip-header { animation: h_kf 30s infinite steps(30); -webkit-animation: h_kf 30s infinite steps(30); }
    @keyframes h_kf { 0% { width: 0px; } 12%, 100% { width: 770px; } }
    @-webkit-keyframes h_kf { 0% { width: 0px; } 12%, 100% { width: 770px; } }
  </style>

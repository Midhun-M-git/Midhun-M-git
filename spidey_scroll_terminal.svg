      -webkit-animation: blink 0.8s infinite;
      fill: #e74c3c;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @-webkit-keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }



name: Auto Update Spidey Terminal Repositories

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/python-version@v4
        with:
          python-version: '3.10'

      - name: Fetch Latest Repositories and Build Spidey Terminal SVG
        run: python fetch_all_repos_and_build_terminal.py

      - name: Commit and Push Updated Terminal & Graph SVGs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update Spidey Terminal & Contribution Graph SVGs [skip ci]"
          file_pattern: "*.svg"
